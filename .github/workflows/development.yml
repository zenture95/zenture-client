name: Development CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy strict
        run: python -m mypy

      - name: Pyright strict
        run: python -m pyright

      - name: Build distributions
        run: python -m build

      - name: Check package artifact contents
        run: python scripts/check_package_artifacts.py dist

      - name: Fresh install smoke test
        run: python scripts/smoke_install_wheel.py dist

      - name: Validate distributions
        run: python -m twine check dist/*

  testing:
    name: Testing (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" "hatchling==1.32.4"

      - name: Pytest with coverage
        run: python -m coverage run -m pytest

      - name: Coverage gate
        run: python -m coverage report

  # Only a macOS Keychain test exists. Windows and Linux native tests do not exist yet,
  # so this opt-in job runs on macOS only and makes no claim for other systems.
  native-keyring:
    name: Native keyring (macOS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Native credential store tests (opt-in)
        run: python -m pytest tests/unit/auth/test_store.py -m native_keyring

  governance:
    name: Governance
    runs-on: ubuntu-latest
    needs:
      - quality
      - testing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate bootstrap files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "LICENSE"
            "NOTICE"
            "THIRD_PARTY_NOTICES.md"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "CHANGELOG.md"
            "scripts/check_dependency_licenses.py"
            "scripts/check_release_tag.py"
            ".github/CODEOWNERS"
            ".github/dependabot.yml"
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

      - name: Guard against committed secrets
        shell: bash
        run: |
          set -euo pipefail

          python scripts/check_release_safety.py

  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package, development, and build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" "hatchling==1.32.4"

      - name: Check dependency licenses
        run: python scripts/check_dependency_licenses.py
