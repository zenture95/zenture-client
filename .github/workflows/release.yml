name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI using Trusted Publishing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy strict
        run: python -m mypy

      - name: Pyright strict
        run: python -m pyright

  testing:
    name: Testing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: python -m coverage run -m pytest

      - name: Coverage gate
        run: python -m coverage report

  preflight:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - quality
      - testing
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release mode
        shell: bash
        run: |
          set -euo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref_type=${GITHUB_REF_TYPE}"
          echo "ref_name=${GITHUB_REF_NAME}"

      - name: Validate publish tag and package version
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "PyPI publishing must run from a protected version tag."
            exit 1
          fi

          python scripts/check_release_tag.py "${GITHUB_REF_NAME}"

      - name: Check public release safety
        run: python scripts/check_release_safety.py

  build:
    name: Release artifacts
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install build twine

      - name: Check dependency licenses
        run: python -m pip install -e ".[dev]" "hatchling==1.32.4" && python scripts/check_dependency_licenses.py

      - name: Build distributions
        run: python -m build

      - name: Check package artifact contents
        run: python scripts/check_package_artifacts.py dist

      - name: Fresh install smoke test
        run: python scripts/smoke_install_wheel.py dist

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenture-dist
          path: dist/*

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zenture-dist
          path: dist

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
