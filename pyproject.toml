[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zenture"
dynamic = ["version"]
description = "Official Python SDK for the zenture Public API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "zenture UG (haftungsbeschraenkt)" },
]
keywords = ["zenture", "sdk", "api", "ai", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "httpx2>=2.5,<3",
  "pydantic>=2.7,<3",
  "mcp>=2.0.0,<2.1",
  "keyring>=25.6,<26",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
mcp = [
  "mcp==2.0.0",
]
dev = [
  "hatchling>=1.26",
  "build>=1.2",
  "mypy>=1.13",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "twine>=6.0",
  "coverage[toml]>=7.6",
]

[project.scripts]
zenture = "zenture.cli:main"

[project.urls]
Homepage = "https://www.zenture.app/about"
Repository = "https://github.com/zenture95/zenture-client"
Issues = "https://github.com/zenture95/zenture-client/issues"

[tool.hatch.version]
path = "src/zenture/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/docs",
  "/examples",
  "/LICENSE",
  "/NOTICE",
  "/openapi",
  "/README.md",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zenture"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not real_e2e and not native_keyring"]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
markers = [
  "real_e2e: explicit real MCP/API acceptance against an approved remote target",
  "native_keyring: uses the real native credential store of the host OS (run with -m native_keyring)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["zenture"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
